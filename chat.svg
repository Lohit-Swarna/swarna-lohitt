<svg width="800" height="315" viewBox="0 0 800 315" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #101820; }
    .card { fill: #fff; stroke: #1a242f; stroke-width:2; rx:18; ry:18;}
    .headline { font-family: 'Segoe UI', Arial, sans-serif; font-size: 32px; font-weight: bold; fill: #1a242f; letter-spacing:0.5px; }
    .msg { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; fill: #363643; font-weight: 500;}
    .footer { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; fill: #0079ff; font-weight: bold;}
    .icon { font-size: 28px; }
  </style>
  <rect width="800" height="315" class="bg"/>
  <rect x="24" y="32" width="752" height="250" class="card"/>
  <text x="70" y="88" class="headline">Data Science: My Domain.</text>
  <text x="70" y="130" class="msg">Learning from documentation & open-source communities.</text>
  <text x="70" y="172" class="msg">Debugging, fixing bugs, & pushing ideas into production 
    <tspan class="icon">🚀</tspan>
  </text>
  <text x="70" y="214" class="footer">Let’s connect and build together!</text>
  <!-- Optional: NY skyline art or subtle lines for "Billionaire street" style -->
  <g>
    <rect x="600" y="210" width="12" height="45" fill="#1a242f" opacity="0.45"/>
    <rect x="630" y="190" width="18" height="65" fill="#1a242f" opacity="0.42"/>
    <rect x="670" y="170" width="9" height="85" fill="#2c4157" opacity="0.53"/>
    <rect x="695" y="180" width="6" height="75" fill="#0079ff" opacity="0.33"/>
    <rect x="720" y="200" width="15" height="55" fill="#1a242f" opacity="0.39"/>
    <circle cx="730" cy="200" r="3.5" fill="#eab022"/>
  </g>
</svg>

