name: Portfolio checks

on:
  push:
    branches: [main, 'portfolio/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate registry, links and assets
        run: python scripts/validate_portfolio.py
      - name: Test governed BI invariants
        run: python -m unittest discover -s projects/governed-bi/tests -v
